<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}Gold Sail Ravenna · Bavaria Yachts a Marina di Ravenna</title>
<meta name="description" content="{{ page.sommario | default: page.excerpt | strip_html | strip_newlines | truncate: 160 | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:image" content="{{ page.copertina | default: page.immagine | default: '/img/site/w-c42-ex-15.jpg' | absolute_url }}">
<link rel="icon" href="{{ '/img/site/logo.png' | relative_url }}">
<link rel="preload" href="{{ '/fonts/fraunces-latin-full-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/fonts/plus-jakarta-sans-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
{% include icons.html %}
<header id="top">
  <nav class="nav" aria-label="Principale">
    <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ '/img/site/logo.png' | relative_url }}" width="580" height="410" alt="Gold Sail Ravenna, home"></a>
    <ul>
      <li><a href="{{ '/#nuove' | relative_url }}">Nuove</a></li>
      <li><a href="{{ '/barche/' | relative_url }}">Barche in vendita</a></li>
      <li><a href="{{ '/#ricambi' | relative_url }}">Ricambi</a></li>
      <li><a href="{{ '/novita/' | relative_url }}">Novità</a></li>
    </ul>
    <a class="btn gold" href="{{ '/#contatti' | relative_url }}">Contatti<span class="ic"><svg><use href="#arr"/></svg></span></a>
    <button class="burger" type="button" aria-label="Apri il menu" aria-expanded="false" aria-controls="overlay"><span></span><span></span></button>
  </nav>
  <div class="overlay" id="overlay">
    <a href="{{ '/#nuove' | relative_url }}">Nuove</a><a href="{{ '/barche/' | relative_url }}">Barche in vendita</a><a href="{{ '/#ricambi' | relative_url }}">Ricambi</a><a href="{{ '/novita/' | relative_url }}">Novità</a><a href="{{ '/#contatti' | relative_url }}">Contatti</a>
  </div>
</header>
{{ content }}
<footer>
  <div class="wrap">
    <img src="{{ '/img/site/logo.png' | relative_url }}" width="580" height="410" alt="Gold Sail Ravenna" loading="lazy">
    <nav aria-label="Pagina"><a href="{{ '/barche/' | relative_url }}">Barche in vendita</a><a href="{{ '/#ricambi' | relative_url }}">Ricambi</a><a href="{{ '/novita/' | relative_url }}">Novità</a><a href="{{ '/#contatti' | relative_url }}">Contatti</a></nav>
    <p>© {{ site.time | date: "%Y" }} Gold Sail Ravenna S.r.l.s. · P. IVA 02494170398 · <a href="https://www.goldsailravenna.com/informativa-sulla-privacy.html">Privacy</a></p>
  </div>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
